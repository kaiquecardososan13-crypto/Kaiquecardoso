name: PC Windows - Preparação

on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Preparar PC
        shell: powershell
        run: |
          Write-Host "===== PC WINDOWS ====="

          $info = Get-ComputerInfo
          Write-Host "Windows: $($info.WindowsProductName)"
          Write-Host "Versão: $($info.WindowsVersion)"
          Write-Host "Arquitetura: $($info.OsArchitecture)"

          $cpu = Get-CimInstance Win32_Processor
          Write-Host "CPU: $($cpu.Name)"
          Write-Host "Núcleos disponíveis: $($cpu.NumberOfLogicalProcessors)"

          $ram = Get-CimInstance Win32_ComputerSystem
          Write-Host ("RAM: {0:N2} GB" -f ($ram.TotalPhysicalMemory / 1GB))

      - name: Verificar RDP
        shell: powershell
        run: |
          Write-Host "===== RDP ====="

          $service = Get-Service TermService -ErrorAction SilentlyContinue

          if ($service) {
            Write-Host "Serviço RDP encontrado: $($service.Status)"
          } else {
            Write-Host "Serviço RDP não disponível neste ambiente."
          }

      - name: Finalizar
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "PC de teste preparado!"
          Write-Host "Este runner é permanente pelo GitHub."
